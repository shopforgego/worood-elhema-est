<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>
  <!-- Background Shield / Hexagon -->
  <polygon points="250,20 450,110 450,370 250,470 50,370 50,110" fill="url(#metalGrad)" stroke="url(#amberGrad)" stroke-width="8"/>
  <polygon points="250,40 430,120 430,355 250,445 70,355 70,120" fill="none" stroke="#334155" stroke-width="2"/>
  
  <!-- Stylized Sports Car Front / Turbo Gear -->
  <g transform="translate(250, 190) scale(1.2)">
    <!-- Headlight beams / Wing elements -->
    <path d="M-80,-20 L-40,-50 L40,-50 L80,-20 L70,-5 L-70,-5 Z" fill="url(#amberGrad)"/>
    <!-- Car Grille & Hood -->
    <path d="M-55,-5 L55,-5 L45,35 L-45,35 Z" fill="#0f172a" stroke="url(#amberGrad)" stroke-width="3"/>
    <!-- Grille Slots -->
    <line x1="-30" y1="5" x2="-30" y2="25" stroke="#f59e0b" stroke-width="3"/>
    <line x1="-15" y1="5" x2="-15" y2="25" stroke="#f59e0b" stroke-width="3"/>
    <line x1="0" y1="5" x2="0" y2="25" stroke="#f59e0b" stroke-width="3"/>
    <line x1="15" y1="5" x2="15" y2="25" stroke="#f59e0b" stroke-width="3"/>
    <line x1="30" y1="5" x2="30" y2="25" stroke="#f59e0b" stroke-width="3"/>
    <!-- Sleek Headlights -->
    <polygon points="-75,-15 -50,-10 -55,-25 -80,-20" fill="#38bdf8"/>
    <polygon points="75,-15 50,-10 55,-25 80,-20" fill="#38bdf8"/>
    <!-- Center Racing Emblem -->
    <circle cx="0" cy="-28" r="14" fill="url(#redGrad)" stroke="#ffffff" stroke-width="2"/>
    <polygon points="0,-36 5,-23 -5,-23" fill="#ffffff"/>
  </g>

  <!-- Typography -->
  <text x="250" y="345" font-family="Tajawal, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">ورود الهمة</text>
  <text x="250" y="380" font-family="Tajawal, sans-serif" font-size="20" font-weight="700" fill="#f59e0b" text-anchor="middle">قطع غيار واكسسوارات السيارات</text>
  <text x="250" y="415" font-family="Tajawal, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">WURUD ALHIMAH AUTO PARTS</text>
</svg>